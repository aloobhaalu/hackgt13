# Included by Ubuntu's nginx.conf inside the http context.
limit_req_zone $binary_remote_addr zone=repready_recap:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;
    server_tokens off;
    client_max_body_size 8k;

    # Certbot adds the HTTPS listener and HTTP -> HTTPS redirect after DNS is ready.
    location = /api/session-recap {
        limit_req zone=repready_recap burst=5 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
